name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The site lives at https://<you>.github.io/<repo-name>/ so the build needs that base path.
      # (If your repo is named <you>.github.io, change the next line to VITE_BASE: /)
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # GitHub Pages has no server routing: a copy of index.html as 404.html lets links like /home?country=laos open directly.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
